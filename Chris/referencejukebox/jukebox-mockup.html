<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Album Jukebox – mockup</title>
<style>
  :root {
    --bg: #f7f3ec;
    --ink: #24212b;
    --muted: #6d6875;
    --panel: #fffdf8;
    --line: #e6dfd3;
    --coral: #ff6b5b;
    --coral-dark: #c94032;
    --mint: #3cc8b4;
    --amber: #ffc145;
    --lamp-off: #e6e0d6;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  button, input { font: inherit; color: inherit; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  :focus-visible { outline: 3px solid var(--mint); outline-offset: 2px; }

  .app-head { max-width: 1100px; margin: 0 auto; padding: 20px 16px 12px; }
  .app-head h1 { margin: 0; font-size: 1.5rem; letter-spacing: -.01em; }
  .app-head p { margin: 2px 0 0; color: var(--muted); }

  .layout {
    display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr);
    max-width: 1100px; margin: 0 auto; padding: 0 16px 48px;
  }

  /* Jukebox body */
  .jukebox {
    --cabinet-mint: #91e6d5;
    --cabinet-coral: #ff9a83;
    --cabinet-yellow: #fff29a;
    position: relative; isolation: isolate;
    background: var(--cabinet-coral);
    border: 2px solid #394651;
    border-radius: 220px 220px 24px 24px;
    padding: 132px 28px 22px;
    box-shadow: 7px 8px 0 #d9c8d6, inset -8px 0 0 #df7c79;
  }
  .jukebox::before {
    content: ""; position: absolute; inset: 9px; z-index: -1;
    border: 9px solid var(--cabinet-mint); border-radius: inherit;
    box-shadow: 0 0 0 2px #394651, inset 0 0 0 2px #394651,
      inset 0 0 0 8px var(--cabinet-yellow), inset 0 0 0 10px #394651;
    pointer-events: none;
  }
  /* Decorative bulbs follow the crown; functional filter lamps remain below. */
  .arch-lights {
    position: absolute; top: 24px; left: 30px; right: 30px; height: 92px;
    pointer-events: none;
  }
  .arch-lights span {
    position: absolute; left: var(--x); top: var(--y);
    width: 10px; height: 19px; border: 1px solid #394651; border-radius: 6px;
    background: var(--cabinet-mint);
    transform: translateX(-50%) rotate(var(--tilt));
    box-shadow: inset 2px 2px 0 #ffffff70, 0 0 0 3px #626878;
  }
  .arch-lights span:nth-child(3n + 2) { background: var(--cabinet-yellow); }
  .arch-lights span:nth-child(3n) { background: var(--cabinet-coral); }
  .arch-lights span:nth-child(1) { --x: 4%; --y: 85%; --tilt: -65deg; }
  .arch-lights span:nth-child(2) { --x: 9%; --y: 62%; --tilt: -55deg; }
  .arch-lights span:nth-child(3) { --x: 16%; --y: 40%; --tilt: -45deg; }
  .arch-lights span:nth-child(4) { --x: 24%; --y: 22%; --tilt: -35deg; }
  .arch-lights span:nth-child(5) { --x: 32%; --y: 10%; --tilt: -25deg; }
  .arch-lights span:nth-child(6) { --x: 41%; --y: 2%; --tilt: -12deg; }
  .arch-lights span:nth-child(7) { --x: 50%; --y: 0%; --tilt: 0deg; }
  .arch-lights span:nth-child(8) { --x: 59%; --y: 2%; --tilt: 12deg; }
  .arch-lights span:nth-child(9) { --x: 68%; --y: 10%; --tilt: 25deg; }
  .arch-lights span:nth-child(10) { --x: 76%; --y: 22%; --tilt: 35deg; }
  .arch-lights span:nth-child(11) { --x: 84%; --y: 40%; --tilt: 45deg; }
  .arch-lights span:nth-child(12) { --x: 91%; --y: 62%; --tilt: 55deg; }
  .arch-lights span:nth-child(13) { --x: 96%; --y: 85%; --tilt: 65deg; }
  .speaker-grille {
    height: 100px; margin-top: 14px; border: 5px solid #c9d8c8;
    border-radius: 50% 50% 10px 10px / 22% 22% 10px 10px;
    outline: 2px solid #394651;
    background: repeating-linear-gradient(90deg, transparent 0 6px, #394651 6px 8px),
      radial-gradient(ellipse at 50% 100%, #f6cf96 0 24%, #75688f 25% 52%, #9b8cb5 53%);
    box-shadow: inset 0 0 0 2px #394651;
  }
  .marquee {
    position: absolute; top: 70px; left: 50%; transform: translateX(-50%);
    width: 56%; margin: 0; padding: 9px 5px;
    background: var(--cabinet-coral);
    border: 2px solid #394651; border-radius: 50% 50% 10px 10px;
    box-shadow: 0 0 0 4px var(--cabinet-mint), 0 0 0 6px #394651;
    text-align: center;
    color: #394651;
    font-weight: 800;
    letter-spacing: .3em;
    font-size: 1.05rem;
  }
  .lights {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
    margin: 14px 0 0; padding: 8px;
    background: #c8dfd7; border: 2px solid #394651; border-radius: 10px;
    box-shadow: inset 0 0 0 3px #e9eee2, 3px 3px 0 #b16d78;
  }
  .light {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 0;
    min-height: 44px; padding: 4px 1px; border: 2px solid #9faeaa; border-radius: 5px;
    background: #fff9e9; cursor: pointer; font-size: .75rem; font-weight: 600; line-height: 1.1;
    text-transform: uppercase; letter-spacing: 0; color: var(--muted);
  }
  .light-text { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lamp {
    flex: none; width: 10px; height: 10px; border-radius: 50%;
    background: var(--lamp-off); transition: background .2s, box-shadow .2s;
  }
  .light.on { border-color: var(--amber); color: var(--ink); }
  .light.on .lamp { background: var(--amber); box-shadow: 0 0 0 3px rgba(255, 193, 69, .35), 0 0 10px var(--amber); }

  .counter {
    margin: 10px 0 0; padding: 6px; text-align: center; font-size: .95rem;
    background: #fff5d9; border: 2px solid #687875; border-radius: 6px;
  }
  .counter strong { font-size: 1.4rem; font-variant-numeric: tabular-nums; }
  .pool-note { color: var(--muted); }

  .stage {
    position: relative; overflow: hidden;
    display: flex; flex-direction: column;
    background: linear-gradient(128deg, #ffffff35 0 15%, transparent 15% 34%, #ffffff15 34% 43%, transparent 43%),
      linear-gradient(#8d81a8 0 60%, #baa5bd);
    border: 0; border-radius: 12px;
    box-shadow: inset 0 0 0 2px #394651, inset 0 0 0 7px #cbd9c7;
  }
  .stage::before {
    content: ""; position: absolute; left: 10px; right: 10px; top: 0; height: 6px;
    background: var(--ink); border-radius: 0 0 4px 4px; z-index: 6;
  }
  .rack {
    display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px;
    margin: 0 10px 10px; padding: 10px;
    background: repeating-linear-gradient(#fff5d9 0 20px, #ebc8af 20px 21px);
    border: 2px solid #56666b; border-radius: 5px;
    box-shadow: 0 0 0 3px #a8d7ca;
  }
  .rec {
    aspect-ratio: 1; border-radius: 4px;
    box-shadow: 0 1px 0 rgba(0, 0, 0, .15);
    transition: opacity .3s, transform .3s, filter .3s, box-shadow .3s;
  }
  .rec.outpool { opacity: .5; }
  .rec.dim { opacity: .15; transform: scale(.6); filter: grayscale(1); }
  .rec.current { box-shadow: 0 0 0 2px var(--mint); }
  .rec.chosen { transform: scale(1.18); box-shadow: 0 0 0 3px var(--amber); opacity: 1; filter: none; }
  .rec.taken { opacity: 0; }

  .turntable {
    order: -1;
    position: relative; width: min(230px, 72%); aspect-ratio: 1.3;
    margin: 38px auto 18px; background: #efb6a4; border: 2px solid #394651;
    border-radius: 14px; box-shadow: 4px 5px 0 #615775;
  }
  .platter {
    position: absolute; left: 7%; top: 50%; width: 64%; aspect-ratio: 1;
    transform: translateY(-50%); border-radius: 50%; background: #b6d8cb;
    border: 2px solid var(--ink);
  }
  .vinyl {
    position: absolute; inset: 4%; border-radius: 50%;
    background: repeating-radial-gradient(circle, #1d1b22 0 2px, #2c2933 2px 4px);
    opacity: 0; transition: opacity .2s;
  }
  .vinyl.loaded { opacity: 1; }
  .vinyl.spinning { animation: spin 1.4s cubic-bezier(.2, .6, .3, 1); }
  @keyframes spin { from { transform: rotate(0); } to { transform: rotate(1080deg); } }
  .vinyl-label, .flyer-label {
    position: absolute; inset: 32%; border-radius: 50%;
    display: grid; place-items: center; overflow: hidden;
    color: #fff; font-weight: 800; font-size: .7rem; text-shadow: 0 1px 2px rgba(0, 0, 0, .4);
  }
  .vinyl-label::after, .flyer-label::after {
    content: ""; position: absolute; width: 6px; height: 6px; border-radius: 50%;
    background: var(--ink); left: calc(50% - 3px); top: calc(50% - 3px);
  }
  .vinyl-label span { transform: translateY(-9px); }
  .tonearm {
    position: absolute; right: 9%; top: 10%; width: 6px; height: 62%;
    background: var(--ink); border-radius: 3px;
    transform-origin: 50% 0; transform: rotate(0deg); transition: transform .5s ease;
  }
  .tonearm::before {
    content: ""; position: absolute; top: -6px; left: -6px; width: 18px; height: 18px;
    border-radius: 50%; background: var(--coral); border: 2px solid var(--ink);
  }
  .tonearm::after {
    content: ""; position: absolute; bottom: -4px; left: -4px; width: 14px; height: 10px;
    border-radius: 2px; background: var(--ink);
  }
  .tonearm.on { transform: rotate(24deg); }

  .claw {
    position: absolute; left: 0; top: 0; width: 36px; height: 30px;
    z-index: 5; pointer-events: none;
  }
  .claw::before {
    content: ""; position: absolute; left: 50%; bottom: 100%; margin-left: -2px;
    width: 4px; height: 1200px; background: var(--ink);
  }
  .claw-head {
    position: absolute; left: 4px; right: 4px; top: 0; height: 10px;
    background: var(--coral); border: 2px solid var(--ink); border-radius: 4px;
  }
  .finger {
    position: absolute; top: 8px; width: 5px; height: 20px; background: var(--ink);
    border-radius: 0 0 3px 3px; transition: transform .15s;
  }
  .finger.l { left: 5px; transform-origin: 50% 0; transform: rotate(18deg); }
  .finger.r { right: 5px; transform-origin: 50% 0; transform: rotate(-18deg); }
  .claw.closed .finger.l { transform: rotate(-6deg); }
  .claw.closed .finger.r { transform: rotate(6deg); }

  .flyer {
    position: absolute; left: 0; top: 0; border-radius: 50%; z-index: 4;
    background: repeating-radial-gradient(circle, #1d1b22 0 2px, #2c2933 2px 4px);
    transform-origin: 50% 50%;
  }

  .empty {
    margin: 12px 0 0; padding: 12px; border-radius: 12px; text-align: center;
    background: #fff2ef; border: 2px dashed var(--coral);
  }
  .empty p { margin: 0 0 8px; }

  .modes {
    border: 2px solid #687875; border-radius: 8px; padding: 8px; margin: 14px 0 12px;
    background: #d5e3d8;
  }
  .modes legend { font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; }
  .seg { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .seg label { position: relative; }
  .seg input { position: absolute; opacity: 0; inset: 0; margin: 0; }
  .seg span {
    display: block; text-align: center; padding: 8px 6px; border-radius: 10px;
    border: 2px solid var(--line); background: #fff; font-size: .85rem; font-weight: 600; cursor: pointer;
  }
  .seg input:checked + span { background: #4a5266; border-color: var(--ink); color: #fff; }
  .seg input:focus-visible + span { outline: 3px solid var(--mint); outline-offset: 2px; }
  .jukebox :focus-visible, .jukebox .seg input:focus-visible + span { outline-color: #514367; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 44px; padding: 10px 18px; border-radius: 999px; border: 2px solid var(--ink);
    font-weight: 700; text-decoration: none; cursor: pointer; background: #fff;
  }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .dip {
    width: 100%; font-size: 1.15rem; letter-spacing: .02em;
    background: var(--cabinet-yellow); color: var(--ink); border-color: var(--ink);
    box-shadow: 0 4px 0 var(--ink);
  }
  .dip:not(:disabled):active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  .dip-hint { margin: 10px 0 0; text-align: center; color: var(--muted); font-size: .85rem; min-height: 1.2em; }

  /* Result card */
  .card {
    background: var(--panel); border: 3px solid var(--ink); border-radius: var(--radius);
    padding: 16px; transition: opacity .3s, transform .3s;
  }
  .card.is-pending { opacity: .25; transform: translateY(6px); pointer-events: none; }
  .card-tag {
    display: inline-block; margin: 0 0 12px; padding: 3px 10px; border-radius: 999px;
    background: var(--amber); font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
  }
  .card-body { display: flex; gap: 14px; align-items: flex-start; }
  .cover {
    flex: none; width: 120px; aspect-ratio: 1; border-radius: 8px; border: 2px solid var(--ink);
    display: grid; place-items: center; color: #fff; font-size: 2rem; font-weight: 800;
    text-shadow: 0 2px 4px rgba(0, 0, 0, .35);
  }
  .card-info { min-width: 0; }
  .card-info h2 { margin: 0; font-size: 1.2rem; line-height: 1.2; overflow-wrap: anywhere; }
  .card-info h2:focus { outline: none; }
  .card-artist { margin: 2px 0 10px; color: var(--muted); font-weight: 600; }
  .meta { display: grid; gap: 4px; margin: 0; font-size: .88rem; }
  .meta div { display: flex; gap: 6px; }
  .meta dt { color: var(--muted); min-width: 78px; }
  .meta dd { margin: 0; font-weight: 600; }
  .card-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  .btn-spotify { background: var(--mint); }
  .roll-msg { margin: 10px 0 0; font-size: .88rem; color: var(--muted); min-height: 1.3em; }
  .roll-msg.out { color: var(--coral-dark); font-weight: 700; }

  /* Filters */
  .filters { background: var(--panel); border: 2px solid var(--line); border-radius: var(--radius); padding: 16px; }
  .filters-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .filters-head h2 { margin: 0; font-size: 1.1rem; }
  .link-btn { display: inline-flex; align-items: center; min-height: 44px; min-width: 44px; background: none; border: 0; padding: 6px 10px; color: var(--coral-dark); font-weight: 700; cursor: pointer; text-decoration: underline; }
  details.group { border-top: 1px solid var(--line); padding: 4px 0; }
  details.group summary {
    cursor: pointer; padding: 8px 0; font-weight: 700; display: flex; align-items: center; gap: 8px;
    list-style: none;
  }
  details.group summary::-webkit-details-marker { display: none; }
  details.group summary::after { content: "+"; margin-left: auto; color: var(--muted); }
  details.group[open] summary::after { content: "–"; }
  .group-count { font-size: .75rem; background: var(--amber); border-radius: 999px; padding: 0 7px; }
  .group-count:empty { display: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 0 10px; }
  .chip {
    min-height: 36px; padding: 6px 12px; border-radius: 999px; border: 2px solid var(--line);
    background: #fff; font-size: .85rem; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .text-filter { width: 100%; min-height: 44px; padding: 8px 12px; margin: 2px 0 10px; border: 2px solid var(--line); border-radius: 10px; background: #fff; }

  @media (min-width: 600px) {
    .rack { grid-template-columns: repeat(10, 1fr); }
    .seg { grid-template-columns: repeat(4, 1fr); }
    .cover { width: 150px; }
  }
  @media (min-width: 880px) {
    .layout {
      grid-template-columns: minmax(360px, 440px) minmax(0, 1fr);
      grid-template-areas: "box card" "box filters";
      align-items: start;
    }
    .jukebox { grid-area: box; position: sticky; top: 16px; }
    .card { grid-area: card; }
    .filters { grid-area: filters; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<header class="app-head">
  <h1>Album Jukebox</h1>
  <p>Whole albums from your favourites. No algorithm.</p>
</header>

<main class="layout">
  <section class="jukebox" aria-label="Jukebox">
    <div class="arch-lights" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="marquee" aria-hidden="true">JUKEBOX</div>

    <div class="stage" id="stage">
      <div class="rack" id="rack" aria-hidden="true"></div>
      <div class="turntable" aria-hidden="true">
        <div class="platter" id="platter">
          <div class="vinyl" id="vinyl"><div class="vinyl-label" id="vinylLabel"><span></span></div></div>
        </div>
        <div class="tonearm" id="tonearm"></div>
      </div>
      <div class="claw" id="claw" aria-hidden="true">
        <span class="claw-head"></span><span class="finger l"></span><span class="finger r"></span>
      </div>
    </div>

    <div class="lights" id="lights" role="group" aria-label="Filter selectors"></div>

    <p class="counter">
      <strong id="count">0</strong> <span id="countLabel">records</span>
      <span class="pool-note" id="poolNote"></span>
    </p>

    <div class="empty" id="empty" hidden>
      <p>No records match these filters.</p>
      <button class="btn" type="button" id="emptyClear">Clear filters</button>
    </div>

    <fieldset class="modes">
      <legend>Pick from</legend>
      <div class="seg">
        <label><input type="radio" name="mode" value="any" checked><span>Any</span></label>
        <label><input type="radio" name="mode" value="least"><span>Least played</span></label>
        <label><input type="radio" name="mode" value="most"><span>Most played</span></label>
        <label><input type="radio" name="mode" value="recent"><span>Recently added</span></label>
      </div>
    </fieldset>

    <button class="btn dip" type="button" id="dip">Lucky Dip</button>
    <p class="dip-hint" id="dipHint"></p>
    <div class="speaker-grille" aria-hidden="true"></div>
  </section>

  <section class="card" id="card" aria-labelledby="cardTitle">
    <p class="card-tag" id="cardTag"></p>
    <div class="card-body">
      <div class="cover" id="cardCover" aria-hidden="true"><span></span></div>
      <div class="card-info">
        <h2 id="cardTitle" tabindex="-1"></h2>
        <p class="card-artist" id="cardArtist"></p>
        <dl class="meta">
          <div><dt>Year</dt><dd id="cardYear"></dd></div>
          <div><dt>Plays</dt><dd id="cardPlays"></dd></div>
          <div><dt>Last picked</dt><dd id="cardPicked"></dd></div>
        </dl>
      </div>
    </div>
    <div class="card-actions">
      <a class="btn btn-spotify" id="spotify" href="#" target="_blank" rel="noopener noreferrer">Open in Spotify</a>
      <button class="btn" type="button" id="reroll">Re-roll</button>
    </div>
    <p class="roll-msg" id="rollMsg"></p>
  </section>

  <section class="filters" aria-labelledby="filtersTitle">
    <div class="filters-head">
      <h2 id="filtersTitle">Filters</h2>
      <button class="link-btn" type="button" id="clearAll">Clear all</button>
    </div>
    <div id="groups"></div>
  </section>
</main>

<p class="sr-only" id="countLive" aria-live="polite"></p>

  const MAX_ROLLS = 3;

  }

  const albums = RAW.map((a, i) => ({

  // ---------- helpers ----------
  function hash(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) {

    }
    return h >>> 0;
  }

  function mulberry32(seed) {

    return () => {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };

  function coverBackground(a) {

    const h2 = (h1 + 60 + ((h >>> 9) % 180)) % 360;
    const c1 = `hsl(${h1}, 70%, 62%)`;
    const c2 = `hsl(${h2}, 60%, 42%)`;

    if (!words.length) return title.slice(0, 2).toUpperCase();
    const text = words.length > 1 ? words[0][0] + words[1][0] : words[0].slice(0, 2);

  function formatDate(d) {

    { key: 'artist', label: 'Artist', type: 'text', field: a => a.artist, placeholder: 'Search artists' },
    { key: 'album', label: 'Album', type: 'text', field: a => a.title, placeholder: 'Search album titles' },

    { key: 'added', label: 'Added', type: 'chips', value: a => ADDED.find(x => x.test(ageInDays(a.addedDate))).id, options: ADDED }
  ];

  const MODES = {

    least: { label: 'Least played', sort: (a, b) => a.playCount - b.playCount },

  // ---------- state ----------
  const state = {
    filters: {},
    mode: 'any',
    matched: [],
    pool: [],
    current: null,
    source: 'daily',
    session: false,

    rollsLeft: MAX_ROLLS,

  // ---------- DOM ----------
  const $ = id => document.getElementById(id);
  const el = {
    lights: $('lights'), count: $('count'), countLabel: $('countLabel'), poolNote: $('poolNote'),
    stage: $('stage'), rack: $('rack'), platter: $('platter'), vinyl: $('vinyl'), vinylLabel: $('vinylLabel'),
    tonearm: $('tonearm'), claw: $('claw'), empty: $('empty'), emptyClear: $('emptyClear'),

  function buildRack() {

  }

      det.id = 'f-' + g.key;

  // ---------- filtering ----------

    return GROUPS.every(g => {
      const f = state.filters[g.key];

    const poolIds = new Set(state.pool.map(a => a.id));

    rackEls.forEach((r, id) => {
      const inMatch = matchedIds.has(id);

  // ---------- controls & roll limit ----------

  function onDip() {

      if (state.rollsLeft === 0) return;
      state.rollsLeft--;
    } else {
      state.session = true;
      state.committed = false;
      state.rollsLeft = MAX_ROLLS;

    pick();

  function onReroll() {

    state.rollsLeft--;

  }

      return;
    }
    if (state.session) {
      state.session = false;
      state.committed = true;
      updateControls();
    }

  async function pick() {
    const pool = state.pool;
    const candidates = pool.length > 1 && state.current ? pool.filter(a => a.id !== state.current.id) : pool;
    const album = candidates[Math.floor(Math.random() * candidates.length)];

      state.busy = false;

      el.cardTitle.focus();

  function renderCard(album, lastPicked, mode) {

  // ---------- animation ----------
  let clawPos = { x: 0, y: 0 };

  function relCenter(node) {
    const r = node.getBoundingClientRect();

    return {
      x: r.left - s.left - el.stage.clientLeft + r.width / 2,
      y: r.top - s.top - el.stage.clientTop + r.height / 2,
      w: r.width
    };
  }

  function clawHome() {
    return { x: el.stage.clientWidth - 30, y: 22 };
  }

  // Claw fingertips sit just above the target point.
  function clawTransform(p) {
    return `translate(${p.x - CLAW_W / 2}px, ${p.y - CLAW_H * 0.8}px)`;
  }

  function placeClaw(p) {
    clawPos = p;
    el.claw.style.transform = clawTransform(p);
  }

  async function animateTransform(node, from, to, duration) {
    const anim = node.animate([{ transform: from }, { transform: to }],
      { duration, easing: 'cubic-bezier(.45, 0, .25, 1)', fill: 'forwards' });
    await anim.finished;
    node.style.transform = to;
    anim.cancel();
  }

  function moveClaw(p, duration) {
    const from = clawTransform(clawPos);
    clawPos = p;
    return animateTransform(el.claw, from, clawTransform(p), duration);
  }

  async function playAnimation(album) {
    el.tonearm.classList.remove('on');
    if (reduceMotion.matches) {
      setVinyl(album);
      el.tonearm.classList.add('on');
      return;
    }
    const recEl = rackEls.get(album.id);
    el.vinyl.classList.remove('loaded');

    recEl.classList.add('chosen');
    await wait(250);

    const from = relCenter(recEl);
    const to = relCenter(el.platter);
    await moveClaw(from, 600);
    el.claw.classList.add('closed');
    await wait(150);

    const size = el.vinyl.offsetWidth;
    const flyer = document.createElement('div');
    flyer.className = 'flyer';
    flyer.style.width = flyer.style.height = size + 'px';
    const flyerLabel = document.createElement('div');
    flyerLabel.className = 'flyer-label';
    flyerLabel.style.background = coverBackground(album);
    flyer.appendChild(flyerLabel);
    const startT = `translate(${from.x - size / 2}px, ${from.y - size / 2}px) scale(${from.w / size})`;
    const endT = `translate(${to.x - size / 2}px, ${to.y - size / 2}px) scale(1)`;
    flyer.style.transform = startT;
    el.stage.appendChild(flyer);
    recEl.classList.add('taken');

    await Promise.all([moveClaw(to, 800), animateTransform(flyer, startT, endT, 800)]);

    el.claw.classList.remove('closed');
    setVinyl(album);
    flyer.remove();
    recEl.classList.remove('taken', 'chosen');
    moveClaw(clawHome(), 450);

    el.tonearm.classList.add('on');
    el.vinyl.classList.remove('spinning');
    void el.vinyl.offsetWidth; // restart the CSS animation
    el.vinyl.classList.add('spinning');
    await wait(1400);
    el.vinyl.classList.remove('spinning');
  }

  // ---------- album of the day ----------
  function albumOfTheDay() {
    const key = `${today.getFullYear()}-${today.getMonth() + 1}-${today.getDate()}`;
    let saved = null;
    try {
      saved = JSON.parse(localStorage.getItem(DAILY_KEY));
    } catch (err) { /* storage can be blocked on file:// */ }
    if (saved && saved.date === key) {
      const kept = albums.find(a => a.id === saved.albumId);
      if (kept) return kept;
    }
    // Sort by id so the seeded pick doesn't depend on library order.
    const sorted = albums.slice().sort((a, b) => (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
    const album = sorted[Math.floor(mulberry32(hash(key))() * sorted.length)];
    try {
      localStorage.setItem(DAILY_KEY, JSON.stringify({ date: key, albumId: album.id }));
    } catch (err) { /* storage can be blocked on file:// */ }
    return album;
  }

  function showDaily() {
    const daily = albumOfTheDay();
    state.current = daily;
    state.source = 'daily';
    setVinyl(daily);
    el.tonearm.classList.add('on');
    renderCard(daily, daily.lastPicked);
  }

  function onVisibilityChange() {
    if (document.visibilityState !== 'visible') return;
    const now = startOfToday();
    if (now.getTime() === today.getTime()) return;
    today = now;
    // An in-flight pick renders with the new date when it reveals.
    if (!state.busy) {
      if (state.source === 'daily') showDaily();
      else renderCard(state.shown.album, state.shown.lastPicked, state.shown.mode);
    }
    update();
  }

  // ---------- init ----------
  buildRack();
  buildLights();
  buildFilters();

  document.querySelectorAll('input[name="mode"]').forEach(r => {
    r.addEventListener('change', () => {
      state.mode = r.value;
      update();
    });
  });
  el.dip.addEventListener('click', onDip);
  el.reroll.addEventListener('click', onReroll);
  el.spotify.addEventListener('click', onSpotify);
  el.clearAll.addEventListener('click', clearFilters);
  el.emptyClear.addEventListener('click', clearFilters);
  window.addEventListener('resize', () => { if (!state.busy) placeClaw(clawHome()); });
  document.addEventListener('visibilitychange', onVisibilityChange);

  showDaily();
  placeClaw(clawHome());
  update();
})();
</script>
</body>
</html>
